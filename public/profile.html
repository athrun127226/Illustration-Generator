<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - AI插图生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .user-info {
            text-align: center;
            padding: 30px;
            background: #f5f5f5;
            border-radius: 15px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .name { font-size: 24px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .email { color: #666; margin-bottom: 20px; }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .btn-home { background: #4CAF50; }
        .btn-logout { background: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👤 个人中心</h1>
        <div class="user-info">
            <img id="avatar" class="avatar" src="" alt="头像">
            <p id="name" class="name"></p>
            <p id="email" class="email"></p>
            <div class="btn-group">
                <a href="/" class="btn btn-home">🏠 返回首页</a>
                <button onclick="logout()" class="btn btn-logout">🚪 退出登录</button>
            </div>
        </div>
    </div>
    
    <script>
        window.onload = function() {
            const user = localStorage.getItem('user');
            if (!user) {
                window.location.href = '/';
                return;
            }
            
            const userData = JSON.parse(user);
            document.getElementById('avatar').src = userData.picture || 'https://via.placeholder.com/100';
            document.getElementById('name').textContent = userData.name || '未设置名字';
            document.getElementById('email').textContent = userData.email || '';
        };
        
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }
    </script>
</body>
</html>
