<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 插图生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        #result {
            margin-top: 30px;
            text-align: center;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #result img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .loading {
            color: #666;
            font-size: 16px;
        }
        
        .error {
            color: #e74c3c;
            padding: 15px;
            background: #ffeaea;
            border-radius: 8px;
        }
        
        .success {
            color: #27ae60;
            padding: 15px;
            background: #eafff0;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 AI 插图生成器</h1>
        
        <div class="input-group">
            <label for="prompt">描述你想要的图片：</label>
            <input type="text" id="prompt" placeholder="例如：一只可爱的猫咪坐在彩虹上" onkeydown="if(event.key==='Enter')generateImage()">
        </div>
        
        <button onclick="generateImage()" id="generateBtn">生成插图</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function generateImage() {
            const promptInput = document.getElementById('prompt');
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('generateBtn');
回复 澪Alex: 
我不确定替换哪段 ，直接帮我生成完整的
const prompt = promptInput.value.trim();
        if (!prompt) {
            alert('请输入文字描述！');
            return;
        }
        
        // 显示加载状态
        resultDiv.innerHTML = '<p class="loading">🎨 正在生成图片...</p>';
        btn.disabled = true;
        btn.textContent = '生成中...';
        
        try {
            // 直接调用 Pollinations API，不需要后端！
            const encodedPrompt = encodeURIComponent(prompt);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true&seed=${Math.random()}`;
            
            resultDiv.innerHTML = `<img src="${imageUrl}" alt="AI生成的图片" onload="onImageLoad()" onerror="onImageError()">`;
            
        } catch (error) {
            resultDiv.innerHTML = `<p class="error">❌ 生成失败：${error.message}</p>`;
            btn.disabled = false;
            btn.textContent = '生成插图';
        }
    }
    
    function onImageLoad() {
        const btn = document.getElementById('generateBtn');
        btn.disabled = false;
        btn.textContent = '生成插图';
    }
    
    function onImageError() {
        const resultDiv = document.getElementById('result');
        const btn = document.getElementById('generateBtn');
        resultDiv.innerHTML = '<p class="error">❌ 图片加载失败，请重试</p>';
        btn.disabled = false;
        btn.textContent = '生成插图';
    }
</script>
</body>
</html>
